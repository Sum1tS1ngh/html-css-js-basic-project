<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expense-tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css?family=Poly:regular,italic" rel="stylesheet" />
</head>  
<body>
        <div class="container">

            <h1>Expense Tracker</h1>
            <div class="blance-container">
                    <h2 >Your Balance</h2>
                    <h1 id="balance">$0000</h1>

                <div class="summer">

                   <div class="income">
                        <h3>Income</h3>
                        <p id="income-amount">$000</p>
                   </div>

                    <div class="expense">
                        <h3>Expense</h3>
                        <p id="expense-amount">$000</p>
                    </div>
 
                </div>
            </div>


            <div class="maincontainer">

                <div class="transaction-container">

                    <h1>Transactions</h1>
                    <ul id="transaction-list">

                    </ul>
                </div>

                <div class="form-container">
                    <h1>Add Transactions</h1>
                    <form id="transaction-form">
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" placeholder="Enter Description...." required />
                        </div>

                        <div class="form-group">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" placeholder
                            ="Enter Amount...." required />
                            <small>Use negative (-) for expenses</small>
                        </div>

                        <button type="submit">Add transactions</button>
                    </form>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
</body>
</html>
