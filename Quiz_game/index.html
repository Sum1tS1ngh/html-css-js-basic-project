<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start_screen">
        <h1>Quiz Time</h1>
        <p>test your knowledge with quiz Game</p>
        <button id="start_btn">Start Quiz</button>
      </div>

      <div class="screen" id="quiz_screen">
        <div>
          <h2 id="question">add qustion</h2>
        </div>
        <div id="question_info">
          <p>
            Question <span id="question_no">1</span> of
            <span id="total_questions">n</span>
          </p>
          <p>score:<span id="score">0</span></p>
        </div>
        <div class="option_container" id="options"></div>

        <div class="progress_bar" id="progress_bar">
          <div id="progress"></div>
        </div>
      </div>

      <div class="screen" id="result_screen">
        <h1>Quiz Results</h1>
        <div id="result_info">
          <p>
            your score <span id="final_score">0</span> out of
            <span id="max_score">n</span>
          </p>

          <div id="result_message">message</div>
        </div>

        <button id="restart_btn">Restart Quiz</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
